<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- BASIC META -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050016" />

    <!-- SEO -->
    <title>Moesha Aurelle | Software Engineering & Data Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Moesha Aurelle Emaleu Deutou – Software Engineering Technician specializing in MERN stack, Java, databases, and data-driven projects."
    />
    <meta name="robots" content="index,follow" />

    <!-- CANONICAL URL -->
    <link rel="canonical" href="https://my-react-portfolio-eight-nu.vercel.app/" />

    <!-- FAVICON / ICONS -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- MANIFEST -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- PERFORMANCE: PRELOAD LCP IMAGE -->
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/images/portfolio.webp"
      imagesrcset="%PUBLIC_URL%/images/portfolio.webp"
      imagesizes="100vw"
    />

    <!-- OPEN GRAPH -->
    <meta property="og:title" content="Moesha Aurelle | Software Engineering Portfolio" />
    <meta
      property="og:description"
      content="Explore MERN stack projects, logistics systems, hotel management systems, and academic software engineering work."
    />
    <meta property="og:image" content="%PUBLIC_URL%/images/portfolio.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://my-react-portfolio-eight-nu.vercel.app/" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moesha Aurelle | Software Engineering Portfolio" />
    <meta
      name="twitter:description"
      content="Software Engineering Technician specializing in MERN stack, Java, and data-driven projects."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/portfolio.webp" />

    <!-- REDUCE RENDER-BLOCKING -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
