<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- BASIC META -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050016" />

    <!-- TITLE & SEO -->
    <title>Moesha Aurelle | Software Engineering & Data Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Moesha Aurelle Emaleu Deutou – Software Engineering Technician specializing in MERN stack, Java, databases, UI/UX, and data-driven applications."
    />
    <meta name="robots" content="index, follow" />

    <!-- CANONICAL URL -->
    <link rel="canonical" href="https://my-react-portfolio-eight-nu.vercel.app/" />

    <!-- FAVICON / ICONS -->
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="logo192.png" />

    <!-- MANIFEST -->
    <link rel="manifest" href="manifest.json" />

    <!-- ⭐ PERFORMANCE: PRELOAD LCP IMAGE ⭐ -->
    <!-- NOTE: %PUBLIC_URL% must NOT be used here -->
    <link
      rel="preload"
      as="image"
      href="/images/portfolio.webp"
      imagesrcset="/images/portfolio.webp"
      imagesizes="100vw"
    />

    <!-- OPEN GRAPH -->
    <meta property="og:title" content="Moesha Aurelle | Software Engineering Portfolio" />
    <meta
      property="og:description"
      content="Explore MERN stack projects, logistics systems, hotel management systems, and academic software engineering work."
    />
    <meta property="og:image" content="/images/portfolio.webp" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://my-react-portfolio-eight-nu.vercel.app/"
    />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moesha Aurelle | Software Engineering Portfolio" />
    <meta
      name="twitter:description"
      content="Software Engineering Technician specializing in MERN stack, databases, UI/UX design, DevOps, and data-driven software."
    />
    <meta name="twitter:image" content="/images/portfolio.webp" />

    <!-- PERFORMANCE: PRECONNECT FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- LOAD FONTS WITHOUT BLOCKING RENDER -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <!-- FALLBACK FONT -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- PREVENT FLASH OF WHITE BACKGROUND -->
    <style>
      body {
        background: #f7e6ff;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
